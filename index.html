<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Sonora: reproductor de musica tipo Spotify para tu carpeta local y fuentes libres. Sin anuncios y con modo sin internet." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sonora" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Sonora · tu musica, sin anuncios y sin internet</title>

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot__mark"></div>
        <p>Cargando tu musica…</p>
      </div>
    </div>
    <noscript>
      <div class="fatal">
        <h1>Sonora necesita JavaScript</h1>
        <p>Esta app reproduce audio en el navegador, asi que JavaScript tiene que estar activado.</p>
      </div>
    </noscript>
    <style>
      .boot {
        display: grid;
        place-items: center;
        gap: 18px;
        height: 100dvh;
        color: #a0a0ad;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
      }

      .boot__mark {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: linear-gradient(150deg, #1ed760, #0f8a41);
        animation: boot-pulse 1.2s ease-in-out infinite;
      }

      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.9);
          opacity: 0.7;
        }

        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
